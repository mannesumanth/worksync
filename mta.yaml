_schema-version: 3.3.0
ID: worksync
description: A simple CAP project.
version: 1.0.2

modules:
  - name: worksync-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: WorkSync-db
      - name: worksync-destination-service
        parameters:
          service-key:
            name: worksync-destination-service-key
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: worksync-destination-content
    type: com.sap.application.content
    requires:
      - name: worksync-destination-service
        parameters:
          content-target: true
      - name: worksync_html_repo_host
        parameters:
          service-key:
            name: worksync_html_repo_host-key
    parameters:
      content:
        instance:
          destinations:
            - Name: worksync_approuter_worksync_html_repo_host
              ServiceInstanceName: worksync-html5-app-host-service
              ServiceKeyName: worksync_html_repo_host-key
              sap.cloud.service: worksync-approuter

          existing_destinations_policy: ignore
    build-parameters:
      no-source: true

  - name: worksync-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: WorkSync-db

  - name: worksync-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: worksync_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comamistaworksyncui.zip
          name: comamistaworksyncui
          target-path: resources/

  - name: comamistaworksyncui
    type: html5
    path: app/worksyncui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: worksync
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: worksync-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com

              - Authentication: NoAuthentication
                Name: ui5-lib
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com

              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}

            existing_destinations_policy: update
        version: 1.0.2
      service: destination
      service-name: worksync-destination-service
      service-plan: lite

    requires:
      - name: srv-api

  - name: worksync_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: worksync-html5-app-host-service
      service-plan: app-host

  - name: WorkSync-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-container-name: ${service-name}

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
